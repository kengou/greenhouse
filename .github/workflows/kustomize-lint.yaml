name: 'Kustomize lint'
on:
  pull_request:
    paths:
      - 'charts/**'

jobs:
  kustomize:
    runs-on: [ default ]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v5
        with:
          go-version-file: 'go.mod'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Controller-gen
        run: make controller-gen
      - name: Setup Kustomize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --request GET \
          --url "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
          --header "Authorization: Bearer $GH_TOKEN"
      - name: Setup API documentation generator
        run: docker pull ghcr.io/srfrnk/crd-api-doc-gen:latest
      - name: lint
        run: make kustomize-build-crds
